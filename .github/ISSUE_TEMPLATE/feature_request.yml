name: Feature request
description: Propose a focused improvement to simulation project management.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Engineering problem
      description: What job is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Solver-neutral core
        - Run register and comparison
        - Ansys Workbench connector
        - New solver adapter
        - Import/export
        - Packaging and installation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
