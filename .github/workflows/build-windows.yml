name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build portable package
        shell: pwsh
        run: .\packaging\build.ps1 -PythonExe (Get-Command python).Source
      - name: Write checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 .\dist\SimTrail.exe, .\dist\SimTrail-TestKit-0.1.0.zip |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: SimTrail-Windows-${{ github.ref_name }}
          path: |
            dist/SimTrail-TestKit-0.1.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
